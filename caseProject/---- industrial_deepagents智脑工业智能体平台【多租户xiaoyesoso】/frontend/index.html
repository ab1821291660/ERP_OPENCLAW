function PortalChat({ threadId, pendingSend, onConsumePending, onSent, onRequestStart,
                     skills, selectedSkills, toggleSkill, webOn, setWebOn, projectId, notify }) {
  const [messages, setMessages] = useState([]);
  const [attachments, setAttachments] = useState([]);
  const [running, setRunning] = useState(false);
  const [loading, setLoading] = useState(false);
  const [notFound, setNotFound] = useState(false);
  const [showScroll, setShowScroll] = useState(false);
  const [openDetail, setOpenDetail] = useState({});
  const turnRef = useRef(0);
  const abortRef = useRef(null);
  const msgsRef = useRef(null);
  const stickRef = useRef(true);
  const loadDoneRef = useRef(false);   // set synchronously in the thread effect, so the pending
                                       // effect in the same commit can't fire on a stale loading value
  const sendSeqRef = useRef(0);        // bumped on every send(); lets an in-flight GET /messages
                                       // skip overwriting messages that a send already appended

  // Abort in-flight stream when switching threads / unmounting.
  useEffect(() => {
    if (!threadId) { setMessages([]); setLoading(false); setNotFound(false); return; }
    abortRef.current?.abort();
    loadDoneRef.current = false;
    const seqAtLoad = sendSeqRef.current;
    setLoading(true); setNotFound(false); setMessages([]); setOpenDetail({});
    api(`/threads/${threadId}/messages`)
      .then(rows => {
        if (sendSeqRef.current !== seqAtLoad) return;  // a send began mid-load; don't clobber it
        setMessages(rows.map(m => ({
          role: m.role, content: m.content,
          toolCards: m.role === "assistant" && m.tool_calls
            ? m.tool_calls.map(tc => ({ key: tc.id || tc.name, name: tc.name, state: "ok" })) : [],
        })));
      })
      .catch(e => { if (!(e instanceof AuthLost)) setNotFound(true); })
      .finally(() => { loadDoneRef.current = true; setLoading(false); });
    return () => { abortRef.current?.abort(); };
  }, [threadId]);

  useEffect(() => {
    if (pendingSend && threadId && loadDoneRef.current) {
      const text = pendingSend;
      onConsumePending();
      send(text);
    }
  }, [pendingSend, threadId, loading]);

  useEffect(() => {
    if (stickRef.current) msgsRef.current?.scrollTo({ top: msgsRef.current.scrollHeight });
  }, [messages, running]);

  useEffect(() => {
    setAttachments([]);
  }, [projectId]);

  function onScroll() {
    const el = msgsRef.current;
    if (!el) return;
    const near = el.scrollHeight - el.scrollTop - el.clientHeight < 120;
    stickRef.current = near;
    setShowScroll(!near);
  }

  async function send(contentRaw, files = attachments) {
    const raw = (contentRaw || "").trim();
    if (!raw || running) return;
    const prefixes = selectedSkills.map(s => `[技能：${(skills.find(k => k.name === s) || {}).label || s}]`);
    if (webOn) prefixes.push("[联网搜索]");
    files.forEach(file => {
      prefixes.push(`[附件：${file.filename}｜${formatBytes(file.size)}｜解析 Skill：${file.parser_skill}｜状态：${file.status}]`);
    });
    const content = (prefixes.length ? prefixes.join("\n") + "\n" : "") + raw;
    if (!threadId) {
      setAttachments([]);
      onRequestStart(content);
      return;
    }

    const myTick = ++turnRef.current;
    sendSeqRef.current++;
    setRunning(true);
    stickRef.current = true;
    setMessages(ms => [...ms, { role: "user", content: raw, toolCards: [] }]);
    setMessages(ms => [...ms, {
      role: "assistant", content: "", toolCards: [], error: "", streaming: true,
      tokens: null, thinking: "", pending: true,
    }]);

    const patchLast = (fn) => {
      if (turnRef.current !== myTick) return;
      setMessages(ms => ms.map((m, i) => i === ms.length - 1 ? fn(m) : m));
    };
    const ctrl = new AbortController();
    abortRef.current = ctrl;
    const startedAt = performance.now();
    setAttachments([]);

    await runSSE(threadId, content, {
      signal: ctrl.signal,
      onToken: (t) => patchLast(m => ({ ...m, content: m.content + t, pending: false })),
      onThinking: (t) => patchLast(m => ({ ...m, thinking: m.thinking + t, pending: t ? false : m.pending })),
      onToolCall: (d) => patchLast(m => ({
        ...m, toolCards: [...m.toolCards, { key: d.id || `${d.name}-${Date.now()}`, name: d.name, state: "run", args: d.args }],
      })),
      onToolResult: (d) => patchLast(m => ({
        ...m,
        toolCards: m.toolCards.map(c =>
          (!c.state || c.state === "run") && (!d.id || c.key === d.id)
            ? { ...c, state: "ok", detail: d.content } : c),
      })),
      onDone: (d) => {
        patchLast(m => ({
          ...m, content: d.content || m.content, streaming: false, tokens: d.tokens,
          langfuseUrl: d.langfuse_url, elapsedMs: Math.round(performance.now() - startedAt), failed: false,
        }));
        setRunning(false);
        onSent && onSent();
      },
      onError: (msg) => {
        patchLast(m => ({
          ...m, streaming: false, error: msg, failed: true,
          elapsedMs: Math.round(performance.now() - startedAt),
        }));
        setRunning(false);
        onSent && onSent();
      },
      onAbort: () => {
        patchLast(m => ({ ...m, streaming: false, failed: !m.content, error: m.content ? m.error : "已取消" }));
        setRunning(false);
      },
      onAuthLost: () => window.location.reload(),
    });
  }

  const composer = (
    <div className="p-composer-wrap">
      <PortalComposer running={running} onSend={send} skills={skills}
        selectedSkills={selectedSkills} toggleSkill={toggleSkill}
        webOn={webOn} setWebOn={setWebOn} projectId={projectId}
        attachments={attachments} onAttachmentsChange={setAttachments} notify={notify} />
      <div className="p-disclaimer">内容由 AI 生成，仅供参考</div>
    </div>
  );

  if (!threadId) {
    return (
      <div className="p-chat">
        <div className="p-empty">
          <div className="big">⚙️</div>
          <div className="ttl">智脑 · 非标方案专家</div>
          <div className="sub">选择一个场景，或直接在下方描述你的非标设计问题</div>
          <div className="p-examples">
            {PORTAL_EXAMPLES.map(([ico, ttl, desc]) => (
              <button key={ttl} className="p-example" onClick={() => send(desc)}>
                <b>{ico} {ttl}</b>{desc}
              </button>
            ))}
          </div>
        </div>
        {composer}
      </div>
    );
  }
  if (loading) return <div className="p-chat"><div className="p-loading"><span className="spin" /> 加载中…</div></div>;
  if (notFound) return <div className="p-chat"><div className="p-loading">对话不存在或无权访问</div></div>;

  return (
    <div className="p-chat">
      <div className="p-msgs" ref={msgsRef} onScroll={onScroll}>
        {messages.length === 0 && <div className="p-loading">开始你的第一条消息</div>}
        {messages.map((m, i) => m.role === "user" ? (
          <div key={i} className="p-row user">
            <div className="p-bubble-u">{stripPrefixLines(m.content)}</div>
          </div>
        ) : (
          <div key={i} className="p-row">
            <div className="p-ai">
              {(m.pending || m.thinking) && <ThinkingBlock text={m.thinking} active={m.streaming && !m.content} />}
              {m.toolCards && m.toolCards.length > 0 && (
                <div className="p-tools">
                  {m.toolCards.map(tc => (
                    <div key={tc.key} className="tool-chip">
                      <span>🔧 {TOOL_LABELS[tc.name] || tc.name}</span>
                      <span className={`state ${tc.state}`}>
                        {tc.state === "run" ? "执行中" : tc.state === "err" ? "失败" : "完成"}
                      </span>
                      {tc.detail && <pre>{tc.detail}</pre>}
                    </div>
                  ))}
                </div>
              )}
              {m.content ? <Markdown text={m.content} /> : (m.streaming ? "" : null)}
              {m.streaming && <span className="cursor" />}
              {m.error && <div className="msg-err">⚠ {m.error}</div>}
              {!m.streaming && m.elapsedMs != null && (
                <>
                  <div className={`p-status ${m.failed ? "err" : ""}`}
                       onClick={() => setOpenDetail(o => ({ ...o, [i]: !o[i] }))}>
                    {m.failed ? "执行失败" : `已完成 ${Math.max(1, Math.round(m.elapsedMs / 1000))} 秒`} <span>⌄</span>
                  </div>
                  {openDetail[i] && (
                    <div className="p-status-detail">
                      {m.tokens ? `tokens ${m.tokens.total_tokens}（输入 ${m.tokens.input_tokens} / 输出 ${m.tokens.output_tokens}）` : "无 token 统计"}
                      {m.langfuseUrl && <> · <a href={m.langfuseUrl} target="_blank" rel="noreferrer">Langfuse ↗</a></>}
                    </div>
                  )}
                </>
              )}
            </div>
          </div>
        ))}
      </div>
      {showScroll && (
        <button className="p-scroll-btn" onClick={() => {
          stickRef.current = true; setShowScroll(false);
          msgsRef.current?.scrollTo({ top: msgsRef.current.scrollHeight, behavior: "smooth" });
        }}>↓</button>
      )}
      {composer}
    </div>
  );
}

function SkillsModal({ skills, selectedSkills, toggleSkill, onClose }) {
  return (
    <div className="modal-mask" onMouseDown={onClose}>
      <div className="p-modal-card" onMouseDown={e => e.stopPropagation()}>
        <h3>skills 工具库</h3>
        <div style={{ fontSize: 12.5, color: "var(--ink-3)", marginBottom: 12 }}>
          所有技能已封装为智能体可调用的 skill：发送匹配问题时智能体会自动读取技能指令执行；显式勾选则随消息注入技能前缀。标注「演示数据」的技能数据源为演示样例，正式数据需对接客户系统。
        </div>
        {skills.map(sk => (
          <button key={sk.name} className="p-skill-item" style={{ width: "100%" }}
            onClick={() => toggleSkill(sk.name)}>
            <span className="ico">{SKILL_ICONS[sk.icon] || "🧩"}</span>
            <span className="meta">
              <span className="lab">{sk.label}{sk.data_live === false && <i className="demo">演示数据</i>}</span>
              <span className="desc">{sk.description}</span>
            </span>
            <span className={`tag ${sk.connected ? "on" : ""}`}>
              {selectedSkills.includes(sk.name) ? "✓ 已选" : sk.connected ? "已接通" : "未接通"}
            </span>
          </button>
        ))}
        <div className="modal-foot">
          <button className="btn btn-primary" onClick={onClose}>完成</button>
        </div>
      </div>
    </div>
  );
}

function KnowledgeModal({ onClose }) {
  const [q, setQ] = useState("");
  const [items, setItems] = useState([]);
  const [loading, setLoading] = useState(true);

  function search(term) {
    setLoading(true);
    api(`/industrial/knowledge?q=${encodeURIComponent(term)}&limit=50`)
      .then(d => setItems(d.items || []))
      .catch(() => setItems([]))
      .finally(() => setLoading(false));
  }
  useEffect(() => { search(""); }, []);

  return (
    <div className="modal-mask" onMouseDown={onClose}>
      <div className="p-modal-card" onMouseDown={e => e.stopPropagation()}>
        <h3>工业大脑 · 知识库检索</h3>
        <form onSubmit={e => { e.preventDefault(); search(q); }} style={{ display: "flex", gap: 8, marginBottom: 14 }}>
          <input style={{ flex: 1, border: "1px solid var(--line)", borderRadius: 9, padding: "8px 11px" }}
            placeholder="关键词，如：井道 中分门 对重 ESW" value={q}
            onChange={e => setQ(e.target.value)} />
          <button className="btn btn-primary btn-sm">检索</button>
        </form>
        {loading ? <div className="empty">加载中…</div>
          : items.length === 0 ? <div className="empty">未检索到适用条款</div>
          : items.map(it => (
            <div key={it.id} className="p-know-item">
              <div className="meta">
                <span className="badge role-admin">{it.family}</span>
                <span>{it.category}</span>
              </div>
              <div className="ttl">{it.title}</div>
              <div className="body">{it.content}</div>
            </div>
          ))}
        <div className="modal-foot">
          <button className="btn" onClick={onClose}>关闭</button>
        </div>
      </div>
    </div>
  );
}

function PortalShell({ session, agents, projects, reloadProjects, notify, onEnterAdmin, onLogout }) {
  const [threadId, setThreadId] = useState(null);
  const [threads, setThreads] = useState([]);
  const [projectId, setProjectId] = useState(null);
  const [pendingSend, setPendingSend] = useState("");
  const [skills, setSkills] = useState([]);
  const [selectedSkills, setSelectedSkills] = useState([]);
  const [webOn, setWebOn] = useState(false);
  const [showKnowledge, setShowKnowledge] = useState(false);
  const [showSkills, setShowSkills] = useState(false);
  const [filterOn, setFilterOn] = useState(false);
  const [filter, setFilter] = useState("");
  const [tick, setTick] = useState(0);
  const ensuredRef = useRef(false);
  const fallbackWarnedRef = useRef(false);

  useEffect(() => {
    api("/industrial/skills").then(d => setSkills(d.items || [])).catch(() => {});
  }, []);

  useEffect(() => {
    if (ensuredRef.current || projects.length === 0) return;
    ensuredRef.current = true;
    setProjectId(projects[0].id);
  }, [projects]);

  useEffect(() => {
    if (!projectId) { setThreads([]); return; }
    api(`/threads?project_id=${encodeURIComponent(projectId)}`)
      .then(setThreads).catch(() => {});
  }, [projectId, tick]);

  const toggleSkill = useCallback((name) => {
    setSelectedSkills(prev => prev.includes(name) ? prev.filter(s => s !== name) : [...prev, name]);
  }, []);

  async function startConversation(question = "") {
    const preferred = agents.find(a => a.name === PORTAL_AGENT_NAME);
    if (!agents.length) { notify("智能体尚未就绪，请联系管理员", "err"); return; }
    if (!preferred && !fallbackWarnedRef.current) {
      fallbackWarnedRef.current = true;
      notify("未找到「智脑 · 非标方案专家」，已为你选择第一个可用智能体", "err");
    }
    const agent = preferred || agents[0];
    const pid = projectId || projects[0]?.id || "";
    try {
      const t = await api("/threads", { method: "POST", body: { agent_id: agent.id, project_id: pid } });
      setProjectId(t.project_id);
      setThreadId(t.id);
      if (question) setPendingSend(question);
      reloadProjects();
      setTick(x => x + 1);
    } catch (e) { notify(e.message, "err"); }
  }

  function refreshHistory() { setTick(x => x + 1); reloadProjects(); }

  return (
    <>
      <div className="shell" style={{ flexDirection: "column" }}>
        <PortalTopBar session={session} onEnterAdmin={onEnterAdmin} onLogout={onLogout} />
        <div className="p-body">
          <IconRail rail="history"
            onHistory={() => { setShowKnowledge(false); setShowSkills(false); }}
            onSearch={() => { setShowSkills(false); setShowKnowledge(true); }}
            onSkills={() => { setShowKnowledge(false); setShowSkills(true); }}
            onSettings={onEnterAdmin}
            searchOn={showKnowledge} skillsOn={showSkills} />
          <HistoryPane threads={threads} threadId={threadId}
            onOpen={id => setThreadId(id)} onNew={() => setThreadId(null)}
            filter={filter} setFilter={setFilter}
            filterOn={filterOn} setFilterOn={setFilterOn} />
          <PortalChat threadId={threadId} pendingSend={pendingSend}
            onConsumePending={() => setPendingSend("")}
            onSent={refreshHistory}
            onRequestStart={(text) => startConversation(text)}
            skills={skills} selectedSkills={selectedSkills} toggleSkill={toggleSkill}
            webOn={webOn} setWebOn={setWebOn} projectId={projectId} notify={notify} />
        </div>
      </div>
      {showKnowledge && <KnowledgeModal onClose={() => setShowKnowledge(false)} />}
      {showSkills && <SkillsModal skills={skills} selectedSkills={selectedSkills}
        toggleSkill={toggleSkill} onClose={() => setShowSkills(false)} />}
    </>
  );
}

/* ============================== app shell ============================== */

function App() {
  const [session, setSession] = useState(loadSession());
  const [view, setView] = useState("home");
  const [threadId, setThreadId] = useState(null);
  const [pendingSend, setPendingSend] = useState("");
  const [agents, setAgents] = useState([]);
  const [catalog, setCatalog] = useState(null);
  const [tick, setTick] = useState(0);
  const [toasts, setToast] = useState([]);
  const [traceJump, setTraceJump] = useState(null);
  const [projects, setProjects] = useState([]);
  const [projectId, setProjectId] = useState(null);
  const [projThreads, setProjThreads] = useState([]);
  const [agentId, setAgentId] = useState("");
  const [showProjectModal, setShowProjectModal] = useState(false);
  const [mode, setMode] = useState(() => localStorage.getItem("dap:mode") === "admin" ? "admin" : "portal");

  useEffect(() => {
    document.body.classList.toggle("portal", mode !== "admin");
    localStorage.setItem("dap:mode", mode);
  }, [mode]);

  const notify = useCallback((text, kind="") => {
    const id = Date.now() + Math.random();
    setToast(t => [...t, { id, text, kind }]);
    setTimeout(() => setToast(t => t.filter(x => x.id !== id)), 3200);
  }, []);

  const reloadAgents = useCallback(() => {
    api("/agents").then(rows => {
      setAgents(rows);
      setAgentId(prev => prev || (rows[0] ? rows[0].id : ""));
    }).catch(e => { if (e instanceof AuthLost) handleAuthLost(); });
  }, []);

  const loadProjects = useCallback(() => {
    api("/projects").then(setProjects).catch(()=>{});
  }, []);

  function handleAuthLost() {
    saveSession(null);
    setSession(null);
  }

  useEffect(() => {
    if (!session) return;
    reloadAgents();
    loadProjects();
    api("/tools").then(setCatalog).catch(()=>{});
  }, [session]);

  // Load conversations of the active project whenever it changes
  useEffect(() => {
    if (!projectId) { setProjThreads([]); return; }
    api(`/threads?project_id=${encodeURIComponent(projectId)}`)
      .then(setProjThreads).catch(()=>{});
  }, [projectId, view, tick]);

  // Global error boundary-ish listener: 401 from SSE
  useEffect(() => {
    function onAuth() { handleAuthLost(); }
    window.addEventListener("dap:unauth", onAuth);
    function onGotoEval() { setView("eval"); }
    window.addEventListener("dap:goto-eval", onGotoEval);
    return () => {
      window.removeEventListener("dap:unauth", onAuth);
      window.removeEventListener("dap:goto-eval", onGotoEval);
    };
  }, []);

  function onAuthed(s) {
    saveSession(s);
    setSession(s);
    setView("home");
  }
  function logout() {
    if (!confirm("退出登录？")) return;
    saveSession(null); setSession(null);
  }
  function openProject(id) {
    setProjectId(id);
    setThreadId(null);
    setView("project");
  }
  function openThread(id) {
    setThreadId(id);
    setView("chat");
  }
  async function createConversation(pid = "") {
    const useAgent = agentId || (agents[0] && agents[0].id);
    if (!useAgent) { notify("请先创建一个智能体", "err"); setView("agents"); return; }
    const targetPid = pid || projectId || (projects[0] && projects[0].id) || "";
    try {
      const t = await api("/threads", { method:"POST", body:{ agent_id: useAgent, project_id: targetPid } });
      setProjectId(t.project_id);
      setThreadId(t.id);
      setPendingSend("");
      setView("chat");
      loadProjects();
      setTick(x => x + 1);
    } catch (e) { notify(e.message, "err"); }
  }
  async function startChat(aid, content, pid = "") {
    try {
      const t = await api("/threads", { method:"POST", body:{ agent_id: aid, project_id: pid } });
      setProjectId(t.project_id);
      setThreadId(t.id);
      setPendingSend(content);
      setView("chat");
      loadProjects();
    } catch (e) { notify(e.message, "err"); }
  }
  function openTraceFromEval(tid) {
    setTraceJump(tid);
    setView("traces");
  }

  if (!session) return <AuthPage onAuthed={onAuthed} />;

  const titles = { home:"首页", project:"项目", chat:"对话", agents:"智能体", eval:"评测", traces:"运行追踪", settings:"设置" };
  const activeProject = projects.find(p => p.id === projectId) || null;
  const inProject = (view === "project" || view === "chat") && activeProject;

  if (mode === "portal") {
    return (
      <>
        <PortalShell session={session} agents={agents} projects={projects}
          reloadProjects={loadProjects} notify={notify}
          onEnterAdmin={() => setMode("admin")} onLogout={logout} />
        <div className="toast-wrap">
          {toasts.map(t => <div key={t.id} className={`toast ${t.kind}`}>{t.text}</div>)}
        </div>
      </>
    );
  }

  return (
    <div className="shell">
      <Sidebar session={session} view={view} setView={setView}
        projects={projects} projectId={projectId}
        onOpenProject={openProject}
        onNewProject={()=>setShowProjectModal(true)}
        onBackToPortal={() => setMode("portal")}
        onLogout={logout} />
      {inProject ? (
        <main className="main">
          <div className="proj-layout">
            <ConversationColumn project={activeProject} threads={projThreads}
              threadId={threadId} onOpenThread={openThread}
              onNewConversation={()=>createConversation()} />
            <div className="proj-content">
              {view === "chat" && threadId ? (
                <ChatView threadId={threadId} agents={agents}
                  pendingSend={pendingSend} onConsumePending={()=>setPendingSend("")}
                  registerRefresh={()=>{ setTick(t=>t+1); loadProjects(); }} />
              ) : (
                <div className="proj-empty">
                  <div className="ico">💬</div>
                  <div className="t">在「{activeProject.name}」中开始一段新对话</div>
                  <div className="s">对话中生成和上传的文件都会保存在该项目目录下</div>
                  <button className="btn btn-primary" onClick={()=>createConversation()}>＋ 新建对话</button>
                </div>
              )}
            </div>
          </div>
        </main>
      ) : (
        <main className="main">
          <div className="topbar">
            <h2>{titles[view]}</h2>
          </div>
          <div className="content">
            {view === "home" && <HomeView agents={agents} projects={projects}
              onPickAgent={setAgentId} onStartChat={startChat} />}
            {view === "agents" && <AgentsView session={session} agents={agents}
              reloadAgents={reloadAgents} catalog={catalog} notify={notify} />}
            {view === "eval" && <EvalView agents={agents} notify={notify} onOpenTrace={openTraceFromEval} />}
            {view === "traces" && <TracesView initialTraceId={traceJump} consumeInitial={()=>setTraceJump(null)} />}
            {view === "settings" && <SettingsView session={session} setSession={setSession}
              notify={notify} onLogout={logout} />}
          </div>
        </main>
      )}
      {showProjectModal && <ProjectModal notify={notify}
        onClose={()=>setShowProjectModal(false)}
        onCreated={p => { loadProjects(); openProject(p.id); }} />}
      <div className="toast-wrap">
        {toasts.map(t => <div key={t.id} className={`toast ${t.kind}`}>{t.text}</div>)}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
